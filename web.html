      color: white;

      padding: 20px;

    }

      display: block;
    }
    .login-form {
      max-width: 300px;
      margin: auto;
    }
    .login-form input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
    }
    .login-form button {
      width: 100%;
      padding: 10px;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
    }
    .login-form button:hover {
      background: #555;
    }
  </style>
</head>
